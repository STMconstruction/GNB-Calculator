<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор услуг ГНБ</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Калькулятор услуг ГНБ</h1>

    <form id="calcForm" novalidate>
        <label for="user_name">Ваше имя:</label>
        <input type="text" id="user_name" placeholder="Введите имя" maxlength="60" required>

        <label for="contact_phone">Контактный телефон:</label>
        <input type="tel" id="contact_phone" placeholder="+7 (7__) ___-__-__" inputmode="tel" maxlength="18" required>

        <label for="drill_length">Длина бурения (м):</label>
        <input type="number" id="drill_length" placeholder="От 1 до 5000" min="1" max="5000" step="1" required>

        <label for="pipe_diameter">Диаметр трубы (мм):</label>
        <select id="pipe_diameter" required>
            <option value="100">До 100 мм</option>
            <option value="200">100–200 мм</option>
            <option value="315">200–315 мм</option>
        </select>

        <!-- Ловушка для ботов: человек это поле не видит и не заполняет -->
        <input type="text" id="website" name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">

        <button type="button" id="calculateButton">Рассчитать стоимость</button>
    </form>

    <p class="warning">⚠️ Все расчеты являются предварительными.</p>
    <div id="result"></div>

    <a id="waFloat" class="wa-float" href="https://wa.me/77074878821" target="_blank" rel="noopener" aria-label="Написать в WhatsApp">

    </a>

    <script src="script.js"></script>

</body>
</html>
